name: CI

# Minimal permissions for security
permissions:
  contents: read # Read repository contents

# Prevent overlapping CI runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Build project
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ent-protocol tests
        run: npm run test --workspace=packages/ent-protocol

      - name: Run agent tests with coverage
        run: npm run test:coverage

      - name: Run CLI tests
        run: npm run test --workspace=packages/cli

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/agent/coverage/lcov.info
          fail_ci_if_error: false

      - name: Notify completion
        if: always()
        run: |
          echo "CI complete"
